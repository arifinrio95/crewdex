<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crewdex film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Nunito:ital,wght@0,400..900;1,400..700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/web/app.css">
<link rel="stylesheet" href="/web/codex.css">
<link rel="stylesheet" href="/web/cute.css">
<link rel="stylesheet" href="/web/office.css">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#FBF7EF}
  body{font-family:"Nunito",system-ui,sans-serif;color:#2B2522;min-height:0;background:radial-gradient(rgba(43,37,34,.08) 1.4px,transparent 1.7px) 0 0/30px 30px,#FBF7EF}
  .D{font-family:"Fraunces",Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 1}
  #stage{position:absolute;inset:0;overflow:hidden}
  /* drifting paper shapes behind everything */
  .blob{position:absolute;border-radius:46% 54% 60% 40%/48% 42% 58% 52%;opacity:.5;filter:blur(2px);animation:blob 18s ease-in-out infinite alternate}
  @keyframes blob{to{transform:translate(60px,-40px) rotate(24deg) scale(1.12)}}
  #cam{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #win{position:absolute;left:0;top:0;width:1560px;border-radius:22px;background:#FBF7EF;box-shadow:0 2px 0 rgba(43,37,34,.06),0 50px 120px -30px rgba(84,58,30,.5),0 0 0 1.5px rgba(43,37,34,.13);overflow:hidden}
  #bar{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#F4EEE3;border-bottom:1px solid rgba(43,37,34,.08)}
  #bar i{width:13px;height:13px;border-radius:50%;background:#EC6A5E}#bar i:nth-child(2){background:#F4BF4F}#bar i:nth-child(3){background:#61C554}
  #bar span{flex:1;text-align:center;font-weight:800;font-size:13px;color:#A79D93;margin-right:60px}
  #app{display:block;border:0;width:1560px;height:960px;background:#FBF7EF}
  #cursor{position:absolute;left:0;top:0;z-index:20;width:30px;height:30px;pointer-events:none;transform:translate(900px,600px);filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
  #ripple{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;border:3px solid #EC7556;opacity:0}
  /* captions */
  #cap{position:absolute;left:84px;bottom:74px;z-index:40;max-width:1300px;pointer-events:none}
  #cap .k{display:inline-flex;align-items:center;gap:12px;font-weight:900;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#FBF7EF;background:#2B2522;padding:9px 20px 8px;border-radius:999px;transform:rotate(-2.5deg);transform-origin:0 100%}
  #cap .k b{color:#EDB43C}
  #cap .h{margin:14px 0 0;font-family:"Fraunces",serif;font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:700;font-size:92px;line-height:.98;letter-spacing:-.035em;color:#2B2522}
  #cap .h .w{display:inline-block;white-space:pre}
  #cap .h em{font-style:italic;font-weight:500;color:#EC7556}
  #cap .h mark{background:linear-gradient(transparent 62%,#EDB43C 62% 92%,transparent 92%);color:inherit;padding:0 .08em}
  #cap.light .h{color:#FBF7EF}
  #capbg{position:absolute;left:0;right:0;bottom:0;height:520px;z-index:39;background:linear-gradient(180deg,rgba(251,247,239,0),rgba(251,247,239,.93) 58%);opacity:0;pointer-events:none}
  #note{position:absolute;right:76px;top:70px;z-index:40;font-weight:900;font-size:30px;padding:16px 28px;border-radius:26px;background:#2B2522;color:#FBF7EF;transform:rotate(3deg);opacity:0;box-shadow:0 12px 0 rgba(43,37,34,.14);max-width:640px;line-height:1.2}
  #note b{color:#EDB43C}
  /* full-screen cards */
  #card{position:absolute;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;opacity:0}
  #card .in{text-align:center;max-width:1700px}
  .big{font-family:"Fraunces",serif;font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:800;font-size:210px;line-height:.9;letter-spacing:-.05em;margin:0}
  .big .w{display:inline-block;white-space:pre}
  .big em{font-style:italic;font-weight:500;color:#EC7556}
  .sub{font-weight:800;font-size:44px;color:#6C635C;margin:34px 0 0}
  .crew{display:flex;justify-content:center;align-items:flex-end;gap:26px;margin-top:40px;height:300px}
  .crew>span{display:inline-block}
  .tile{display:inline-flex;align-items:center;gap:14px;font-weight:900;font-size:48px;padding:18px 34px;border-radius:999px;background:#fff;box-shadow:0 0 0 2px rgba(43,37,34,.12),0 10px 0 rgba(43,37,34,.1);margin:10px}
  .tile i{width:18px;height:18px;border-radius:50%}
  #wipe{position:absolute;inset:0;z-index:55;background:#2B2522;transform:translateY(101%);pointer-events:none}
  #chap{position:absolute;right:70px;bottom:44px;z-index:41;font-family:"Fraunces",serif;font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:900;font-size:230px;line-height:.8;color:transparent;-webkit-text-stroke:3px rgba(43,37,34,.16);opacity:0;pointer-events:none}
  #ring{position:absolute;z-index:19;border-radius:18px;box-shadow:0 0 0 4px #EC7556,0 0 0 12px rgba(236,117,86,.22);opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div class="blob" style="left:-120px;top:-140px;width:620px;height:560px;background:#F6D9C9"></div>
  <div class="blob" style="right:-160px;top:160px;width:560px;height:620px;background:#D9E0FA;animation-duration:23s"></div>
  <div class="blob" style="left:520px;bottom:-260px;width:760px;height:520px;background:#D8EEDF;animation-duration:27s"></div>
  <div id="cam">
    <div id="win"><div id="bar"><i></i><i></i><i></i><span>Crewdex</span></div><iframe id="app" src="/film/app.html"></iframe>
      <div id="ring"></div>
      <svg id="cursor" viewBox="0 0 30 30"><path d="M4 2 L4 24 L10 18.5 L14.2 27.5 L18 25.8 L13.8 17 L22 17 Z" fill="#2B2522" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><g id="ripple"></g></svg>
    </div>
  </div>
  <div id="capbg"></div>
  <div id="chap">01</div>
  <div id="cap"><span class="k"></span><h1 class="h"></h1></div>
  <div id="note"></div>
  <div id="wipe"></div>
  <div id="card"><div class="in"></div></div>
</div>
<script src="/film/governor.js"></script>
<script src="/film/director.js"></script>
</body>
</html>
