<!doctype html>
<html lang="en">
<head>
<base href="/web/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crewdex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&family=Nunito:ital,wght@0,400..900;1,400..700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/katex.min.css">
<link rel="stylesheet" href="vendor/hl-light.css" id="hl-light">
<link rel="stylesheet" href="vendor/hl-dark.css" id="hl-dark" disabled>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="codex.css">
<link rel="stylesheet" href="cute.css">
<link rel="stylesheet" href="office.css">
<style>html{scrollbar-width:none}::-webkit-scrollbar{display:none}</style>
</head>
<body>


<header class="top" id="top">
  <div class="wrap top-in">
    <a class="brand" data-nav="now" aria-label="Crewdex, home">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10.25" stroke="currentColor" stroke-width="1.2" opacity=".45"/><g class="needle"><path d="M12 4.2 14.1 12H9.9L12 4.2Z" fill="currentColor"/><path d="M12 19.8 9.9 12h4.2L12 19.8Z" fill="currentColor" opacity=".28"/></g></svg>
      Crewdex
    </a>
    <nav class="nav" id="nav" aria-label="Views">
      <span class="nav-ind" id="nav-ind"></span>
      <a data-nav="now" href="#now">Now</a>
      <a data-nav="week" href="#week">Week</a>
      <a data-nav="horizon" href="#horizon">Horizon</a>
      <a data-nav="office" href="#office">Office</a>
    </nav>
    <div class="top-r">
      <button class="tbtn primary" data-act="composer" title="Add (N)"><svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="lbl">Add</span></button>
      <button class="tbtn" data-act="palette" title="Command (⌘K)"><svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span class="lbl mono" style="font-size:11.5px">⌘K</span></button>
      <button class="tbtn runs-btn" id="runs-btn" data-act="runs" title="Codex runs" hidden><span class="runs-orb"></span><span id="runs-count" class="mono">0</span></button>
      <button class="tbtn acct-btn" id="acct-btn" data-act="settings" title="Codex account and settings"><span class="acct-dot" id="acct-dot"></span><span class="lbl" id="acct-lbl">Codex</span></button>
      <button class="tbtn" data-act="theme" aria-label="Switch light or dark"><svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11Z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div class="composer" id="composer"><div><div class="wrap comp-in">
    <label class="comp-field" for="qa"><span>+</span><input id="qa" autocomplete="off" spellcheck="false" placeholder="revise validation methodology for Nusa Persona friday"></label>
    <div class="chips" id="qa-chips"></div>
    <div class="comp-hint">Type it the way you'd say it. Project, day and list are picked up as you type. <kbd>Enter</kbd> to add · <kbd>Esc</kbd> to close</div>
  </div></div></div>
</header>

<main class="wrap" id="view" aria-live="polite"></main>

<div class="pal" id="pal" hidden>
  <div class="pal-bg" data-act="pal-close"></div>
  <div class="pal-box" role="dialog" aria-label="Command">
    <div class="pal-in"><svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><input id="pal-q" autocomplete="off" spellcheck="false" placeholder="Move, add, show, open…"></div>
    <div class="pal-list" id="pal-list"></div>
    <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> choose</span><span><kbd>Enter</kbd> run</span><span><kbd>Esc</kbd> close</span><span style="margin-left:auto">N add · 1–4 views · F focus</span></div>
  </div>
</div>
<div class="menu" id="menu" hidden></div>
<div class="toasts" id="toasts"></div>


<aside class="drawer" id="drawer" hidden aria-label="Task"></aside>
<div class="viewer" id="viewer" hidden></div>
<div class="login" id="login" hidden></div>
<div class="menu" id="runs-pop" hidden></div>

<script src="/film/demo.js"></script>
<script src="/film/files/shot.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="vendor/katex-auto-render.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script src="render.js"></script>
<script src="codex.js"></script>
<script src="import.js"></script>
<script src="ui.js"></script>
<script src="agents.js"></script>
<script src="chat.js"></script>
<script src="app.js"></script>
</body>
</html>
